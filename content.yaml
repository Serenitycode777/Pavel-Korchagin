practices:
  - number: 1
    title: "Выравнивание чакр"
    subtitle: "Центрирование энергетических центров и выравнивание центральной оси"
    lead: "Вводная практика."
    tag: ""
    video: "JM2nmKn72y4"          # id видео на YouTube (то, что после youtu.be/)
    # video_file: "technika-1.mp4"  # вариант без YouTube: файл в platform/files/, если указан — приоритет над video
    when: "Вводная практика: с неё начинается круг."
    gives: "Когда энергия течёт свободно, появляются баланс, ясность и внутренняя сила."
    pdf: "technika-1-vyravnivanie-chakr.pdf"
    how:
      - h: "Подготовка"
        p: "Сядь удобно. Выбери положение, в котором тело может расслабиться, а спина остаётся прямой. Закрой глаза. Сделай несколько медленных вдохов и выдохов, переходя вниманием внутрь. Наблюдай дыхание, ощущай тело изнутри. Позволь мыслям замедлиться и прислушайся к тому, как энергия двигается в теле. Позволь себе полностью переключиться в пространство внутреннего восприятия."
      - h: "Работа с центральной осью"
        p: "Ось проходит вдоль позвоночника и служит основой для чакр. Отследи, ровная ли она. Если есть отклонения или изгибы, центрируй её с помощью внимания и намерения."
      - h: "Основные чакры (1-7)"
        p: "Работай с каждой чакрой по порядку, от первой до седьмой."
        steps:
          - "Приблизься к чакре без лишней визуализации."
          - "Представь её как светящуюся точку или вихрь."
          - "При необходимости центрируй её на оси."
          - "Проговори формулу: «Божественный Поток любви разрешает эту ситуацию максимально благоприятно для всех участников ситуации, восстанавливает связь с центром земли и с высшим Я»."
      - h: "Где находятся чакры"
        steps:
          - "1-я: область таза"
          - "2-я: ниже пупка"
          - "3-я: солнечное сплетение"
          - "4-я: сердечный центр"
          - "5-я: горло"
          - "6-я: область третьего глаза"
          - "7-я: макушка головы"
      - h: "Высшие чакры (8-12)"
        p: "Для более полного выстраивания расширь работу до 12 чакр. Для каждой применяется та же методика с формулой и центрированием на оси."
        steps:
          - "8-я: примерно на 40-50 см выше головы, эмоциональное тело"
          - "9-я: ментальное тело"
          - "10-я: кармическое тело"
          - "11-я: связь с родом"
          - "12-я: выход в Абсолют"
  - number: 2
    title: "Временная шкала"
    subtitle: "Снятие зацепок за прошлое и будущее"
    lead: "Возвращает тебя в точку «здесь и сейчас»."
    tag: ""
    video: "JISGyCJX9kM"
    when: "Когда внимание уходит в прошлое (воспоминания, сравнения) или в тревоги о будущем. Подходит и тогда, когда ты не уверен, зацеплен ли: практика работает как диагностика и корректировка внимания."
    gives: "Помогает снять зацепки за прошлое и будущее и вернуть себя в «точку здесь и сейчас»."
    pdf: "technika-2-vremennaya-shkala.pdf"
    how:
      - h: "Зачем это нужно"
        p: "Прошлое удерживает нас через сравнение и воспоминания. Каждый раз, когда мы эмоционально возвращаемся назад, энергия утекает в память и не работает на создание реальности здесь и сейчас. Будущее удерживает через страхи, беспокойства, ожидания и сомнения. Когда внимание направлено туда, появляются нервозность, тревога, пропадает опора."
      - h: "Подготовка"
        p: "Найди удобное положение, сидя или стоя. Тело может расслабиться, спина остаётся прямой. Закрой глаза."
      - h: "Выполнение"
        steps:
          - "Сделай мягкий вдох. На выдохе внутри произнеси: «Моё Высшее Я, сними с меня зацепку за прошлое». Произнеси осознанно, с искренним намерением. Оставайся в тишине около минуты. Не контролируй процесс, просто наблюдай."
          - "Когда почувствуешь завершение, мягко произнеси внутри: «Моё Высшее Я, сними с меня зацепку за будущее». Снова оставайся в молчании 30-60 секунд и наблюдай."
          - "Сделай один глубокий вдох. Почувствуй своё тело и пространство вокруг. Открой глаза и ощути полное присутствие в настоящем моменте."
  - number: 3
    title: "Лучи внимания"
    subtitle: "Повышение концентрации и выход в настоящий момент"
    lead: "Помогает быстро собраться, когда чувствуешь «я ещё там»."
    tag: ""
    video: "8Dw2PfKAGB8"
    when: "Когда нужно быстро собраться: после рабочего дня, после сна, после перелёта, когда чувствуешь «я ещё там»."
    gives: "Повышает концентрацию и помогает выйти в настоящий момент. О правильном выполнении говорит повышение чёткости настоящего момента."
    pdf: "technika-3-luchi-vnimaniya.pdf"
    how:
      - h: "Зачем это нужно"
        p: "Наше внимание вместе с частью энергии или одним из тонких тел может зависнуть в какой-либо ситуации. Особенно это заметно после рабочего дня, иногда после сна или перелёта. В таких случаях говорят «я ещё там», и отчасти это так. На первый взгляд техника может показаться сложной, но каждый из нас делает похожие движения вниманием каждый день, даже не задумываясь."
      - h: "Подготовка"
        p: "Сядь удобно. Тело может расслабиться, спина остаётся прямой. Закрой глаза и позволь себе полностью переключиться в пространство внутреннего восприятия."
      - h: "Выполнение"
        steps:
          - "Спроси себя: сколько тел у меня отсутствует? Ответ придёт на твоём языке понимания. Не бойся ошибиться, главное в самом процессе возвращения внимания. Чаще всего появляется цифра перед глазами."
          - "От тебя до отсутствующих тел идут лучи. Нащупай один из лучей и скользни по нему туда, куда он направлен. Ты нащупаешь своё тело, свою энергию."
          - "Дай этому телу команду вернуться. Вырази намерение, потяни его в своё физическое тело и мысленно скомандуй: «Домой!». Проделай то же с другими лучами."
          - "Повтори проверку из первого пункта. Повышение чёткости настоящего момента говорит о правильном выполнении."
  - number: 4
    title: "Очищение энергетического кокона"
    subtitle: "Снять информационный шум и вернуть энергию себе"
    lead: "Обрезает лишние каналы внимания, которые продолжают тянуть энергию."
    tag: "Вечерняя практика"
    video: "7U-JpV0qnUY"
    when: "Вечерняя практика: подходит в конце дня."
    gives: "Помогает снять информационный шум, обрезать лишние энергетические каналы, восстановить целостность кокона и вернуть энергию себе."
    pdf: "technika-4-ochishchenie-kokona.pdf"
    how:
      - h: "Подготовка"
        p: "Сядь удобно. Тело может расслабиться. Закрой глаза и позволь себе полностью переключиться в пространство внутреннего восприятия."
      - h: "Кокон"
        p: "Представь вокруг себя энергетическое яйцо: свой кокон, свою сферу, свой личный объём. Его можно увидеть как светящуюся оболочку вокруг тебя, слегка вытянутую вверх и вниз. Эту технику можно выполнять и для другого человека, например для родственника, который устал или нуждается в восстановлении. Тогда представляй его внутри энергетического яйца."
      - h: "Настройка луча"
        p: "Подними указательный палец (или два пальца, или ладонь, как удобнее). Представь, что из пальца выходит яркий луч света. Он как лазер: точный, чистый, светящийся. Почувствуй связь между пальцем и светом, будто ты управляешь лучом силой намерения."
      - h: "Работа с коконом"
        p: "Медленно води лучом вокруг энергетического яйца: сверху, сбоку, сзади, снизу, по кругу, в хаотичном режиме, следуя ощущению. Делай это в 3D, со всех сторон. Води лучом, пока движения не станут более ровными и луч не пойдёт легко. Суть процесса в том, чтобы обрезать лишние каналы внимания, которые продолжают тянуть энергию."
  - number: 5
    title: "Круги намерения"
    subtitle: "Отслеживание и снятие негативных кругов намерения"
    lead: "Технику можно делать по надобности, когда чувствуешь, что она нужна."
    tag: ""
    video: "0HhyI9ER6NU"
    when: "По надобности, когда захочешь."
    gives: "Помогает отслеживать и снимать негативные круги намерения."
    pdf: "technika-5-krugi-namereniya.pdf"
    how:
      - h: "Подготовка"
        p: "Сядь удобно. Тело может расслабиться, спина остаётся прямой. Закрой глаза. Позволь внешнему миру мягко раствориться на фоне. Сделай несколько медленных вдохов и выдохов, переходя вниманием внутрь. Перенеси фокус в свой внутренний мир и позволь себе полностью переключиться в пространство внутреннего восприятия."
      - h: "Что такое круги намерения"
        p: "На определённом уровне восприятия вокруг нас движутся круги намерения. Это возвращение того импульса, который мы послали в мир. Они как обручи или кольца вокруг планет охватывают наш личный мир. Они идут издалека и сужаются к центру, имеют разные цвета и разную ширину. Когда круг сжимается и касается уровня нашего тела, его сила приходит в действие в физической реальности, то есть здесь."
      - h: "Выполнение"
        steps:
          - "Нас интересуют серые и чёрные круги. Чтобы их увидеть, выразим намерение и скажем: «Хочу видеть круги намерения!». Ты их увидишь."
          - "Если есть тёмные круги, снимаем их по одному, кладём в костёр и смотрим, как круг сгорает."
          - "Костёр мы представляем так, чтобы колыхание языков пламени ощущалось твоим телом, всеми фибрами. Тогда он будет настоящим, а не иллюзорным."
